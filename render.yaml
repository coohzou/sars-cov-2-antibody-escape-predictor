services:
  - type: web
    name: sars-cov-2-antibody-escape-predictor
    runtime: python
    plan: 1c-2g
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 180 --graceful-timeout 30 --workers 1 --threads 2 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
